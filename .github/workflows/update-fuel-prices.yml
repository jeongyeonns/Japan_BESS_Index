name: Update World Bank fuel prices

on:
  schedule:
    - cron: "0 2 8 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m pip install "pandas>=2.2,<4" "openpyxl>=3.1,<4" "requests>=2.31,<3"
      - run: python -m utils.fuel_price_downloader
      - name: Commit changed fuel prices
        shell: bash
        run: |
          git add data/fuel_prices_2026.csv
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update World Bank fuel prices"
          git push
